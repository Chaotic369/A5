

<div id="clock">00:00:00</div>
<style>
#clock {
  font-family: monospace;
  font-size: 2rem;
  padding: 10px;
}
</style>
<script>
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
}
setInterval(updateClock, 1000);
updateClock();
</script>
